<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .boxes .box {
      height: 100px;
      width: 100px;
      background-color: red;
      font-size: 50px;
      position: absolute;
    }

    .boxes .box:nth-child(2) {
      background-color: orange;
      left: 50px;
      top: 50px;
      z-index: 0;
    }

    .boxes .box:nth-child(3) {
      background-color: purple;
      left: 100px;
      top: 100px;
      z-index: 1;
    }

    .boxes .box:nth-child(4) {
      background-color: aqua;
      left: 150px;
      top: 150px;
      z-index: 2;
    }

    .boxes .box:nth-child(5) {
      background-color: black;
      left: 250px;
      top: 250px;
      z-index: 2;
    }

    .boxes .box:first-child {
      background-color: blueviolet;
      left: 200px;
      top: 200px;
      z-index: 3;

    }
  </style>
</head>

<body>


  <div class="boxes">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
  </div>
</body>

</html>
