  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css"> -->

  <style>
    body {
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      height: 100px;
      width: 100px;
      /* position: relative; */
      background-color: red;
      /* animation: jumpthebox 3s infinite alternate ease; */
      /* transition: all 1s ease; */


    }





    .box:hover {
      /* transform: rotate(360deg); */
      /* transform: scaleX(2); */
      /* transform: skew(-40deg); */
      /* transform: translate(100px, 200px); */
      animation: bounce 0.4s ease;
    }

    @keyframes jumpthebox {
      25% {
        top: 0;
        left: 0;
        background-color: black;
        border-radius: 0;
      }

      50% {
        top: 200px;
        left: 0;
        background-color: red;
        border-radius: 100%;
      }

      75% {
        left: 200px;
        top: 200px;
        background-color: greenyellow;
        border-radius: 0%;

      }

      100% {
        left: 200px;
        top: 0;
        background-color: blue;
        border-radius: 100%;

      }
    }
  </style>
</head>
