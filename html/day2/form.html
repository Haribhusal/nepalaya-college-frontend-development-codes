<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <form action="">
    <div>
      <label for="">Full Name</label>
      <input type="text" placeholder="Enter your full name" />
    </div>
    <br />

    <div>
      <label for="">Email</label>
      <input type="email" placeholder="Enter your Email">
    </div>

    <br />
    <div>
      <label for="">Password</label>
      <input type="password">
    </div>

    <br />
    <div>
      <input type="radio" id="maleselect" name="genderInput">
      <label for="maleselect">Male</label>
    </div>

    <div>
      <input type="radio" id="femaleselect" name="genderInput">
      <label for="femaleselect">Female</label>
    </div>

    <br />

    <div>
      <input type="checkbox" id="f" name="gameselect">
      <label for="f">Football</label>
    </div>

    <div>
      <input type="checkbox" id="c" name="gameselect">
      <label for="c">Cricket</label>
    </div>


    <div>
      <input type="checkbox" id="bb" name="gameselect">
      <label for="bb">Basketball</label>
    </div>

    <br />

    <div>

      <select name="" id="">
        <option value="">Nepal</option>
        <option value="">India</option>
        <option value="">China</option>
        <option value="">USA</option>
        <option value="">Australia</option>
        <option value="">Canada</option>
      </select>
    </div>


    <br />

    <!-- https://www.w3schools.com/html/html_form_input_types.asp -->
    <!-- Homework -->
    <!-- Learn all the html input elements -->
    <button type="submit">Submit</button>

  </form>

</body>

</html>
